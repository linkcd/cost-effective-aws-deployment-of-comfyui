AWSTemplateFormatVersion: '2010-09-09'
Description: CodeBuild project to verify and deploy ComfyUI CDK stack with P0 fixes

Resources:
  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: CleanupOldArtifacts
            Status: Enabled
            ExpirationInDays: 7

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildDeploymentPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteBuildLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
              - Sid: WriteBuildLogStreams
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*:log-stream:*'
              - Sid: ReadSourceBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetBucketVersioning
                  - s3:ListBucket
                Resource: !GetAtt SourceBucket.Arn
              - Sid: ReadSourceObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub '${SourceBucket.Arn}/*'
              - Sid: ReadBootstrapVersion
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cdk-bootstrap/hnb659fds/version'
              - Sid: AssumeBootstrapRoles
                Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-hnb659fds-deploy-role-${AWS::AccountId}-${AWS::Region}'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-hnb659fds-file-publishing-role-${AWS::AccountId}-${AWS::Region}'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-hnb659fds-image-publishing-role-${AWS::AccountId}-${AWS::Region}'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-hnb659fds-lookup-role-${AWS::AccountId}-${AWS::Region}'
                Condition:
                  StringEquals:
                    'iam:ResourceTag/aws-cdk:bootstrap-role':
                      - deploy
                      - file-publishing
                      - image-publishing
                      - lookup

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Description: Synth, test, and deploy the ComfyUI CDK stack with AL2023 GPU AMI
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: CDK_DEFAULT_ACCOUNT
            Value: !Ref AWS::AccountId
          - Name: CDK_DEFAULT_REGION
            Value: !Ref AWS::Region
      Source:
        Type: S3
        Location: !Sub '${SourceBucket}/comfyui-source.zip'
      TimeoutInMinutes: 75
      Tags:
        - Key: Project
          Value: ComfyUI-Pattern-Verification

Outputs:
  CodeBuildProjectName:
    Value: !Ref CodeBuildProject
  SourceBucketName:
    Value: !Ref SourceBucket
  ConsoleURL:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/codesuite/codebuild/projects/${CodeBuildProject}/history?region=${AWS::Region}'
  UploadCommand:
    Value: !Sub 'aws s3 cp /tmp/comfyui-source.zip s3://${SourceBucket}/comfyui-source.zip --region ${AWS::Region}'
